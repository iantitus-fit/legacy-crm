<!DOCTYPE html>
<html>
<body style="margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#1a1a1a; background:#f9f9f9;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f9f9f9; padding:24px 0;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
    <tr>
        <td style="padding:32px 40px 24px 40px;">
            <p style="font-size:16px; line-height:1.6; margin:0 0 16px 0;">
                Dear {{ contact_name or 'Customer' }},
            </p>
            <p style="font-size:15px; line-height:1.6; margin:0 0 16px 0; color:#333;">
                {{ message }}
            </p>
            <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5; border-radius:6px; margin:16px 0;">
                <tr>
                    <td style="padding:16px 20px;">
                        <p style="font-size:13px; color:#888; margin:0 0 4px 0; text-transform:uppercase; letter-spacing:0.5px;">Invoice</p>
                        <p style="font-size:16px; font-weight:600; margin:0; color:#1a1a1a;">{{ invoice_number }}</p>
                    </td>
                </tr>
            </table>
            <p style="font-size:15px; line-height:1.6; margin:16px 0 0 0; color:#333;">
                If you have any questions, please don't hesitate to contact us.
            </p>
        </td>
    </tr>
    <tr>
        <td style="padding:20px 40px 32px 40px; border-top:1px solid #eee;">
            <p style="font-size:14px; font-weight:600; margin:0 0 4px 0; color:#1a1a1a;">{{ company_name }}</p>
            <p style="font-size:13px; margin:0; color:#666;">{{ company_phone }} &nbsp;&middot;&nbsp; {{ company_email }}</p>
        </td>
    </tr>
</table>
</td></tr>
</table>
</body>
</html>
